<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>OpenDev Elite · 让好的开源项目持续生长</title>
    <meta name="description" content="连接项目发现、技术复核、真实体验、作者交流和 Credits 支持的开发者赞助工作台。" />
    <link rel="stylesheet" href="/assets/app.css?v=1.0.7" />
    <link rel="stylesheet" href="/assets/landing.css?v=1.0.7" />
    <link rel="stylesheet" href="/assets/workspace.css?v=1.0.7" />
    <link rel="stylesheet" href="/assets/elite.css?v=1.0.7" />
    <script src="/assets/i18n.en.js?v=1.0.7" defer></script>
    <script src="/assets/i18n.js?v=1.0.7" defer></script>
    <script src="/assets/landing.js?v=1.0.7" defer></script>
    <script src="/assets/forms.js?v=1.0.7" defer></script>
    <script src="/assets/accounts.js?v=1.0.7" defer></script>
    <script src="/assets/views.js?v=1.0.7" defer></script>
    <script src="/assets/developers.js?v=1.0.7" defer></script>
    <script src="/assets/app.js?v=1.0.7" defer></script>
  </head>
  <body>
    <div id="login-view" class="login-shell" hidden>
      <a class="skip-link" href="#team-login">跳到主要内容</a>
      <header class="login-header">
        <a class="wordmark" href="#team-login" aria-label="OpenDev Elite"><span class="brand-icon" aria-hidden="true">O</span><span class="brand-name">OpenDev Elite</span></a>
        <select data-language-select class="language-select" aria-label="界面语言" data-no-i18n><option value="zh-CN">中文</option><option value="en">English</option></select>
      </header>
      <main class="login-main" id="welcome">
      <div class="login-card" id="team-login" tabindex="-1">
        <h1>登录工作台</h1>
        <form id="account-login-form">
          <p id="account-form-description" class="muted">正在连接工作空间…</p>
          <fieldset id="account-fields" disabled>
            <label for="account-username">账号</label><input id="account-username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required minlength="3" maxlength="64" pattern="[A-Za-z0-9][A-Za-z0-9_.@\-]{2,63}" placeholder="输入你的账号">
            <label for="account-password">密码</label><div class="login-password-wrap"><input id="account-password" name="password" type="password" autocomplete="current-password" required maxlength="128" placeholder="输入你的密码"><button id="password-visibility" class="password-visibility" type="button" aria-label="显示密码" aria-pressed="false">显示</button></div>
            <p id="caps-lock-hint" class="muted small" role="status" hidden>大写锁定已开启</p>
            <p id="account-error" class="error-text" role="alert"></p><p id="account-notice" class="account-notice" role="status"></p>
            <button id="account-submit" type="submit" class="button primary full">登录工作台</button>
          </fieldset>
        </form>
        <details id="token-login-details" class="token-login"><summary>其他登录方式</summary>
        <form id="login-form">
          <label for="access-token">访问凭证</label
          ><input
            id="access-token"
            type="password"
            required
            autocomplete="off"
            spellcheck="false"
            placeholder="粘贴个人访问凭证"
          />
          <p id="login-error" class="error-text" role="alert"></p>
          <button type="submit" class="button primary full">
            进入工作台 <span aria-hidden="true">→</span>
          </button>
        </form>
        </details>
        <a
          id="sso-login"
          href="/auth/sso/login"
          class="button full sso-button"
          hidden
          >使用团队单点登录 <span aria-hidden="true">→</span></a
        >
        <p class="login-footnote">
          账号开通或密码重置，请联系管理员。
        </p>
      </div>
      </main>
      <footer class="login-footer">发现优质项目，支持持续创造。</footer>
    </div>
    <div id="workspace" class="workspace" hidden>
      <aside class="sidebar">
        <a class="wordmark" href="#overview"
          ><span class="brand-icon" aria-hidden="true">O</span> <span class="brand-name">OpenDev Elite</span>
          </a
        >
        <div class="workspace-label">
          <span class="status-dot"></span> 开发者赞助计划
          <span class="region">GLOBAL</span>
        </div>
        <nav id="navigation" aria-label="主导航"></nav>
        <div class="sidebar-note">
          <span class="eyebrow">EVIDENCE FIRST</span>
          <p>每一次支持，<br />都有真实体验作为起点。</p>
          <span class="muted small">GitHub → Review → Credits</span>
        </div>
        <div class="identity">
          <div id="identity-avatar" class="avatar">O</div>
          <div class="identity-text">
            <strong id="identity-name"></strong><span id="identity-role"></span>
          </div>
          <button
            id="logout"
            class="icon-button"
            title="退出登录"
            aria-label="退出登录"
          >
            ↗
          </button>
        </div>
      </aside>
      <div class="main-shell">
        <header class="topbar">
          <div>
            <span class="muted">工作空间</span><span class="separator">/</span
            ><strong id="breadcrumb">概览</strong>
          </div>
          <div class="topbar-actions">
            <select data-language-select class="language-select" aria-label="界面语言" data-no-i18n><option value="zh-CN">中文</option><option value="en">English</option></select>
            <span id="connection" class="connection"
              ><span class="status-dot"></span> 已连接</span
            ><button id="refresh" class="button subtle">刷新数据</button>
          </div>
        </header>
        <div class="mobile-account">
          <span id="mobile-identity"></span
          ><button id="mobile-logout" class="button subtle">退出登录</button>
        </div>
        <main id="main" tabindex="-1" aria-label="工作台内容">
          <div class="loading">正在读取工作空间…</div>
        </main>
        <footer class="workspace-footer">
          OPENDEV ELITE <span>全球开源项目 · 证据驱动的赞助流程</span>
        </footer>
      </div>
    </div>
    <dialog id="action-dialog" aria-labelledby="dialog-title">
      <form id="action-form">
        <div class="dialog-head">
          <div>
            <p class="eyebrow" id="dialog-kicker">WORKFLOW ACTION</p>
            <h2 id="dialog-title"></h2>
          </div>
          <button
            type="button"
            class="icon-button"
            id="dialog-close"
            aria-label="关闭"
          >
            ×
          </button>
        </div>
        <p id="dialog-description" class="muted"></p>
        <div id="dialog-fields" class="form-grid"></div>
        <div id="dialog-result" hidden></div>
        <p id="dialog-error" class="error-text" role="alert"></p>
        <div class="dialog-footer">
          <button type="button" id="dialog-cancel" class="button">取消</button
          ><button type="submit" id="dialog-submit" class="button primary">
            保存记录
          </button>
        </div>
      </form>
    </dialog>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
